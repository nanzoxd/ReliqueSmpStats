# Port the mini HTTP API listens on. Make sure this port is open/forwarded
# on your host, and NOT the same as your Minecraft server port (25533).
# 25551 = the secondary allocation on LordCloud; the website proxies /relique/* to it (vercel.json).
port: 25551

# Optional. If set, requests must include header:  X-Api-Key: <this value>
# Leave blank to allow open access (fine if the port is only reachable
# through a reverse proxy you control).
api-key: ""

# How often (in minutes) stats are flushed to disk automatically.
# They are also always saved on server shutdown.
autosave-interval-minutes: 5

elo:
  # Every new player starts here (950 = Combat Novice).
  starting: 950
  # Elo can never drop below this number (700 = Rookie). Players start
  # at Combat Novice and can be knocked down to Rookie, but no lower.
  floor: 700
  # Elo moved per kill is always between these two numbers, scaled by the
  # matchup: beating a much stronger player gives max-change, beating a much
  # weaker player still gives min-change (never 0). Losing works the same way
  # in reverse: losing to a weaker player costs max-change, to a stronger one
  # costs min-change.
  min-change: 10
  max-change: 40
  # Anti-farm safeguard: killing the *same* opponent again (in either
  # direction) within this many seconds won't move Elo a second time,
  # so two players can't trade kills back and forth to inflate rating.
  same-pair-cooldown-seconds: 60
  # "Combat Grandmaster" isn't a fixed Elo number — it's reserved for only
  # this many of the very top players (by Elo, among those above the
  # Combat Master threshold). Everyone else caps out at Combat Master.
  grandmaster-slots: 2
  # Playtime also earns Elo — this many points per full hour played,
  # paid out automatically as hours complete. Set to 0 to disable.
  playtime-reward-per-hour: 5

# In-game leaderboard + player profile dialogs (/leaderboard, /pvpprofile). Needs Paper 1.21.6+.
dialogs:
  # Players per leaderboard page. Two columns, so keep it even (12 = 6 rows).
  players-per-page: 12
  # Width in pixels of each leaderboard button.
  button-width: 180
  # Width in pixels of the text blocks on the profile page.
  profile-width: 320
  # Time zone for dates and times, e.g. "Asia/Kolkata". Blank = the server's time zone.
  timezone: ""
  # Players with this permission get a [PREMIUM] badge on their profile. Blank = no badge.
  premium-permission: ""

# Server health (the website's "Server Health" page reads /api/health).
# Samples TPS, MSPT, RAM, CPU, players, chunks and entities, and remembers restarts and downtime.
# History is saved in health-samples.csv so graphs survive a restart. /reliqueapi reload applies changes.
health:
  enabled: true
  sample-interval-seconds: 30
  keep-hours: 48

# Recipes made with the NgaRecipes plugin (/addrecipe, /editrecipe, /delrecipe) are shown on the website's
# Recipes page. This plugin reads NgaRecipes' own save file, so anything added in-game appears on the site
# within a few seconds. GET /api/recipes serves them.
recipes:
  # Path relative to the server's plugins/ folder (or an absolute path).
  file: "NgaRecipes/recipes.yml"
  check-interval-seconds: 5

# RankedSMPX support. Reads RankedSMPX's own config.yml / ranks.yml and its database (SQLite or MySQL),
# so nothing needs to be set up on its side. /reliqueapi reload applies changes.
ranked:
  # Master switch. true  = RankedSMPX ranks are shown (profile, /api/stats, /api/ranked, placeholders).
  #                false = everything below is off and the database is never read.
  enabled: true
  # Show EVERY ranked player on the server (online or offline) in /rankedplayers and in the
  # "players" list of GET /api/ranked. Only used when enabled is true.
  show-all-players: true
  # Folder name of the RankedSMPX plugin, if you renamed it.
  plugin-name: "RankedSMPX"
  # How often (seconds) the ranks are re-read from the RankedSMPX database.
  cache-seconds: 10
  # /api/ranked marks a ranked player as inactive after this many hours offline.
  inactive-after-hours: 48
