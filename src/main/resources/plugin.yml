name: ReliqueOnlineAPI
version: ${project.version}
main: com.relique.onlineapi.OnlineApiPlugin
api-version: "1.21"
author: Relique
description: Exposes online players, kills, deaths, K/D, blocks mined, playtime, a competitive Elo rating (kills + playtime rewards) (if installed) BetterTeams data and (if installed) the RankedSMPX rank list + config as JSON for the website.
softdepend: [BetterTeams, RankedSMPX]
commands:
  stats:
    description: Reset or revert Relique stats (asks for confirmation, backs up first)
    usage: /stats reset all | /stats reset <player> | /stats revert [number] | /stats backups | /stats confirm
    aliases: [statsreset]
    permission: reliqueapi.reset
permissions:
  reliqueapi.reset:
    description: Allows resetting and reverting stats
    default: op
